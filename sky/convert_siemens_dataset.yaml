# One-shot dataset build for the Siemens industrial packing job.
# Runs in us-west-2 next to s3://xdof-de-prod (raw episodes) because the SZ box
# only gets ~1MB/s to S3. Streams raw MCAP episodes -> LeRobot v2.1 -> v3.0,
# computes openpi norm stats, and uploads everything to the siemens prefix.
#
# Launch:  uv run sky jobs launch sky/convert_siemens_dataset.yaml -n siemens-dataset-convert --yes

name: siemens-dataset-convert

workdir: /home/karim/openpi

resources:
  infra: aws/us-west-2
  cpus: 96+
  memory: 128+
  disk_size: 200

num_nodes: 1

envs:
  REPO_NAME: industrial_packing_yam
  CONFIG_NAME: pi05_siemens_industrial_packing_bs128
  S3_DATASET_PATH: s3://xdof-internal-research/siemens/datasets/industrial_packing_yam

setup: |
  echo "[SETUP] Setting up openpi for dataset conversion"
  conda deactivate 2>/dev/null; conda deactivate 2>/dev/null; true
  if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
  export DEBIAN_FRONTEND=noninteractive
  $SUDO apt-get update && $SUDO apt-get install -y git curl pkg-config software-properties-common awscli
  if $SUDO add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7; then
    $SUDO apt-get update
  else
    echo "[SETUP] FFmpeg 7 PPA unavailable; falling back to distro FFmpeg packages"
  fi
  $SUDO apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
  $SUDO ldconfig || true
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env 2>/dev/null || true
  uv venv --python 3.11
  source .venv/bin/activate
  GIT_LFS_SKIP_SMUDGE=1 uv sync
  GIT_LFS_SKIP_SMUDGE=1 uv pip install -e .
  uv pip install mcap mcap-protobuf-support
  echo "[SETUP] Complete"

run: |
  set -eo pipefail
  conda deactivate 2>/dev/null; conda deactivate 2>/dev/null; true
  source .venv/bin/activate

  echo "[1/5] Converting raw MCAP episodes -> LeRobot v2.1 (duration filter >=10s)"
  python scripts/yam_data/convert_xdof_mcap_job.py \
    --episode-csv job_episodes.csv \
    --repo-name "$REPO_NAME" \
    --min-duration-s 10 \
    --max-workers 48

  echo "[2/5] Migrating v2.1 -> v3.0"
  # --data-file-size-in-mb huge => single data file. lerobot 0.4.5's migrator
  # double-counts num_frames on every data-file rollover (convert_data adds
  # ep_num_frames twice), corrupting dataset_from/to_index for all later
  # episodes; with one file the buggy branch never runs.
  python -m lerobot.datasets.v30.convert_dataset_v21_to_v30 \
    --repo-id "$REPO_NAME" \
    --root "$HOME/.cache/huggingface/lerobot/$REPO_NAME" \
    --data-file-size-in-mb 100000 \
    --push-to-hub false
  rm -rf "$HOME/.cache/huggingface/lerobot/${REPO_NAME}_old"

  echo "[3/5] Sanity-loading the converted dataset"
  python - <<'PYEOF'
  import os
  from lerobot.datasets.lerobot_dataset import LeRobotDataset
  repo = os.environ["REPO_NAME"]
  ds = LeRobotDataset(repo)
  print(f"frames={ds.num_frames} episodes={ds.num_episodes} fps={ds.fps}")
  sample = ds[0]
  for k, v in sample.items():
      print(" ", k, getattr(v, "shape", v) if not isinstance(v, str) else v)
  assert ds.num_episodes > 700, "expected ~716 episodes"
  # boundary consistency: the exact failure mode of the rollover bug
  to_idx = ds.meta.episodes["dataset_to_index"][-1]
  assert to_idx == ds.num_frames == len(ds.hf_dataset), (to_idx, ds.num_frames, len(ds.hf_dataset))
  print("episode boundary check OK")
  PYEOF

  echo "[4/5] Uploading dataset to $S3_DATASET_PATH (before norm stats, so a late failure can't lose it)"
  aws s3 sync "$HOME/.cache/huggingface/lerobot/$REPO_NAME" "$S3_DATASET_PATH" --only-show-errors

  echo "[5/5] Computing openpi norm stats (50k frames) + upload"
  python scripts/compute_norm_stats.py --config-name "$CONFIG_NAME" --max-frames 50000
  aws s3 cp "assets/$CONFIG_NAME/$REPO_NAME/norm_stats.json" "$S3_DATASET_PATH/norm_stats/norm_stats.json"
  echo "[OK] Dataset build complete: $S3_DATASET_PATH"
