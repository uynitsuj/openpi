# simple-D405 v13short25cc (2026-09-11): EXPERIMENT — shortest 25% of valid recent
# demos, ALL 3 cameras center-cropped (--resize-mode center_crop, v12/v13 lineage).
# "Valid" = recent (>=Sep 2), completed, audit not-bad, raw >=20s PLUS 11 rescued
# sub-20s packs (keep-list). --shortest-frac 0.25 keeps only the shortest quartile
# by TRIMMED length (crop-independent selection => identical episode set as the _tc
# variant). Leader actions, driver joint order, baked packing prompt, tail-trim.
#
# Launch: uv run sky jobs launch sky/convert_siemens_simple_d405_v13short25cc.yaml -n siemens-simple-d405-v13short25cc-convert -d --yes

name: siemens-simple-d405-v13short25cc-convert

workdir: /home/karim/openpi

resources:
  infra: aws/us-west-2
  cpus: 128+
  memory: 384+
  disk_size: 400

num_nodes: 1

envs:
  REPO_NAME: siemens_simple_d405_v13short25cc
  CONFIG_NAME: pi05_siemens_simple_d405_v13short25cc_bs128
  S3_DATASET_PATH: s3://xdof-internal-research/siemens/datasets/siemens_simple_d405_v13short25cc
  EPISODE_CSV: job_episodes_simple_d405_v13short_recent.csv
  RESIZE_MODE: center_crop
  MIN_EPISODES: "1500"

setup: |
  echo "[SETUP] Setting up openpi for dataset conversion"
  conda deactivate 2>/dev/null; conda deactivate 2>/dev/null; true
  if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
  export DEBIAN_FRONTEND=noninteractive
  $SUDO apt-get update && $SUDO apt-get install -y git curl pkg-config software-properties-common awscli
  if $SUDO add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7; then
    $SUDO apt-get update
  else
    echo "[SETUP] FFmpeg 7 PPA unavailable; falling back to distro FFmpeg packages"
  fi
  $SUDO apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
  $SUDO ldconfig || true
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env 2>/dev/null || true
  uv venv --python 3.11
  source .venv/bin/activate
  GIT_LFS_SKIP_SMUDGE=1 uv sync
  GIT_LFS_SKIP_SMUDGE=1 uv pip install -e .
  uv pip install mcap mcap-protobuf-support
  echo "[SETUP] Complete"

run: |
  set -eo pipefail
  conda deactivate 2>/dev/null; conda deactivate 2>/dev/null; true
  source .venv/bin/activate

  echo "[1/5] Converting shortest-25% of valid recent demos (resize=$RESIZE_MODE, +keep-list rescue, trim-tails)"
  python scripts/yam_data/convert_xdof_mcap_job.py \
    --episode-csv "$EPISODE_CSV" \
    --repo-name "$REPO_NAME" \
    --min-duration-s 20 \
    --trim-tails \
    --no-flip-joints \
    --resize-mode "$RESIZE_MODE" \
    --keep-ids-csv scripts/yam_data/keep_short_episodes_simple_d405.csv \
    --shortest-frac 0.25 \
    --task-override "Pack one transparent bag into the cardboard box and flatten the bag." \
    --max-workers 112

  echo "[2/5] Migrating v2.1 -> v3.0 (single data file)"
  python -m lerobot.datasets.v30.convert_dataset_v21_to_v30 \
    --repo-id "$REPO_NAME" \
    --root "$HOME/.cache/huggingface/lerobot/$REPO_NAME" \
    --data-file-size-in-mb 100000 \
    --push-to-hub false
  rm -rf "$HOME/.cache/huggingface/lerobot/${REPO_NAME}_old"

  # Provenance guarantee: the v3.0 migration rebuilds meta/ and drops the manifest;
  # restore the parent-dir survivor copy INTO the migrated dataset so the S3 sync
  # ships it. Hard-fails (set -e) if the converter didn't write it.
  cp "$HOME/.cache/huggingface/lerobot/${REPO_NAME}_source_manifest.csv" \
     "$HOME/.cache/huggingface/lerobot/$REPO_NAME/meta/source_manifest.csv"

  echo "[3/5] Sanity-loading the converted dataset"
  python - <<'PYEOF'
  import os
  from lerobot.datasets.lerobot_dataset import LeRobotDataset
  repo = os.environ["REPO_NAME"]
  ds = LeRobotDataset(repo)
  print(f"frames={ds.num_frames} episodes={ds.num_episodes} fps={ds.fps}")
  assert ds.num_episodes > int(os.environ["MIN_EPISODES"]), (ds.num_episodes, os.environ["MIN_EPISODES"])
  to_idx = ds.meta.episodes["dataset_to_index"][-1]
  assert to_idx == ds.num_frames == len(ds.hf_dataset), (to_idx, ds.num_frames, len(ds.hf_dataset))
  print("episode boundary check OK")
  import csv
  mp = os.path.expanduser(f"~/.cache/huggingface/lerobot/{repo}/meta/source_manifest.csv")
  n_manifest = sum(1 for _ in csv.DictReader(open(mp)))
  assert n_manifest == ds.num_episodes, f"source_manifest rows {n_manifest} != episodes {ds.num_episodes}"
  print(f"source manifest OK ({n_manifest} rows)")
  PYEOF

  echo "[4/5] Uploading dataset (+ source manifest for provenance) to $S3_DATASET_PATH"
  aws s3 sync "$HOME/.cache/huggingface/lerobot/$REPO_NAME" "$S3_DATASET_PATH" --only-show-errors
  aws s3 cp "$HOME/.cache/huggingface/lerobot/${REPO_NAME}_source_manifest.csv" "$S3_DATASET_PATH/source_manifest.csv" --only-show-errors || true

  echo "[5/5] Computing openpi norm stats (50k frames) + upload"
  python scripts/compute_norm_stats.py --config-name "$CONFIG_NAME" --max-frames 50000
  aws s3 cp "assets/$CONFIG_NAME/$REPO_NAME/norm_stats.json" "$S3_DATASET_PATH/norm_stats/$CONFIG_NAME/norm_stats.json"
  echo "[OK] Dataset build complete: $S3_DATASET_PATH"
